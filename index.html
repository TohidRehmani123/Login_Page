<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div class="box-1">

        <h1>LOGIN</h1>
        <input type="Username" placeholder="Username" class="Username">
        <input type="Password" placeholder="Password" class="Password">
        <a href="#" class="fgt-psw">Forget Password</a>
        <div class="btn"><button>Login?</button></div>
        <div class="sign-up">
            <p>Don't have an account?</p><a href="#" class="Sign-up">Sign-up</a>
        </div>
    </div>
</body>

<style>

    *{
        margin: 0;
        padding: 0;
        font-family: sans-serif;
        text-decoration: none;
    }

    body{

        width: 100%;
        height: 100vh;
        display: flex;
        background: url(_JPG.jpeg);
        background-repeat: no-repeat;
        background-size: cover;
        align-items: center;
        justify-content: center;
    }

    .box-1{

        border: none;
        border-radius: 20px;
        box-shadow: 0px 0px 5px 5px  rgba(0, 0, 0, 0.444);
        width: min-content;
        height: min-content;
        padding: 10px;
        background: rgba(255, 255, 255, 0.3);
        backdrop-filter: blur(10px);
        
    }

    h1{
        padding: 10px;
        justify-content: center;
        align-items: center;
        display: flex;
    }

    .Username,.Password{

        width: 15rem;
        height: 2rem;
        padding: 5px;
        margin: 20px;
        border: none;
        border-radius: 10px;

    }
    .fgt-psw{

        justify-content: center;
        display: flex;
        text-decoration: none;
        font-size: 14px;
        color: blue;
    }
    .btn{
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;

    }

    button{

        width: 15rem;
        padding: 5px;
        border: none;
        border-radius: 15px;
        background: linear-gradient(to right, rgba(211, 162, 15, 0.748), rgba(82, 21, 131, 0.814));
        color: white;
    }
    .sign-up{

        display: flex;
        justify-content: center;
        align-items: center;
        padding: 10px;
    }
    p{
        display: inline;
        font-size: 14px;
        margin: 10px;
    }
    .Sign-up:hover{
        color: rgb(255, 255, 255);
        text-decoration: underline;
    }
</style>

</html>
